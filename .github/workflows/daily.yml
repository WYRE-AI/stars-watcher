name: Daily digest

on:
  schedule:
    # 14:00 UTC = 10:00 ET (EDT) / 09:00 ET (EST). Aim for "morning coffee" eyeballs.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # state/snapshot.json is no longer tracked on main (branch protection
      # blocks pushing it there, task_1788465884620_03221284) -- it lives on
      # the unprotected `watcher-state` branch instead. Load the prior
      # snapshot from there before running the report. A missing branch (real
      # first run) is handled; any OTHER fetch failure fails the job instead
      # of silently sending a false "everything is new" digest.
      - name: Fetch prior snapshot from watcher-state
        run: |
          set -euo pipefail
          mkdir -p state
          if git fetch origin watcher-state:refs/remotes/origin/watcher-state 2>fetch-err.log; then
            SNAPSHOT_TYPE=$(git cat-file -t origin/watcher-state:state/snapshot.json 2>/dev/null || echo "missing")
            case "$SNAPSHOT_TYPE" in
              blob)
                git show origin/watcher-state:state/snapshot.json > state/snapshot.json
                echo "Loaded prior snapshot from watcher-state."
                ;;
              missing)
                echo "watcher-state branch exists but has no state/snapshot.json yet -- treating as first run."
                rm -f state/snapshot.json
                ;;
              *)
                echo "::error::state/snapshot.json on watcher-state is a $SNAPSHOT_TYPE, not a regular file -- refusing to treat that as a first run (it would silently wipe the real baseline)."
                exit 1
                ;;
            esac
          elif grep -qi "couldn't find remote ref" fetch-err.log; then
            echo "watcher-state branch does not exist yet -- treating as first run."
            rm -f state/snapshot.json
          else
            echo "::error::git fetch of watcher-state failed unexpectedly:"
            cat fetch-err.log
            exit 1
          fi
          rm -f fetch-err.log

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run report
        env:
          # GH_TOKEN handles general org/repo listing — the workflow's built-in
          # GITHUB_TOKEN has every permission we need for that.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_API_TOKEN is the fine-grained PAT used only for cross-repo
          # traffic data (Administration:Read). Optional — clone traffic
          # degrades to a "skipped" line when this is unset.
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          # WYRE Notifier app (org-level secret) → #github-activity, WYRE AI workspace
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0BR5S8F6BZ
        run: python script/report.py

      # Publish the updated snapshot to watcher-state via a separate
      # worktree, rather than committing it on this job's main checkout --
      # main stays untouched, watcher-state isn't branch-protected so this
      # is a plain push, no PR needed. Creates watcher-state on the fly if
      # it doesn't exist yet (rather than requiring it be pre-bootstrapped),
      # so the very first run for a new watcher repo self-heals instead of
      # crashing under `set -e` at the fetch.
      - name: Publish snapshot to watcher-state
        run: |
          set -euo pipefail
          git config user.name "wyre-stars-watcher[bot]"
          git config user.email "stars-watcher@users.noreply.github.com"
          python -m json.tool state/snapshot.json > /dev/null

          # --no-checkout in both branches below: this branch is bot-only
          # today, but a normal checkout would materialize whatever's
          # already committed there, symlinks included, before we `cp` into
          # it. Building `state/` fresh instead means the destination path
          # is always a real directory we just created, never something a
          # future watcher-state commit could have turned into a symlink.
          if git fetch origin watcher-state:refs/remotes/origin/watcher-state 2>publish-fetch-err.log; then
            git worktree add --no-checkout -B watcher-state /tmp/watcher-state-wt origin/watcher-state
          elif grep -qi "couldn't find remote ref" publish-fetch-err.log; then
            echo "watcher-state branch does not exist yet -- creating it."
            git worktree add --no-checkout --detach /tmp/watcher-state-wt
            git -C /tmp/watcher-state-wt checkout --orphan watcher-state
            git -C /tmp/watcher-state-wt rm -rf --cached . > /dev/null 2>&1 || true
          else
            echo "::error::git fetch of watcher-state failed unexpectedly:"
            cat publish-fetch-err.log
            exit 1
          fi
          rm -f publish-fetch-err.log

          mkdir -p /tmp/watcher-state-wt/state
          cp state/snapshot.json /tmp/watcher-state-wt/state/snapshot.json
          cd /tmp/watcher-state-wt
          # -f: the orphan-creation branch above inherits the current HEAD's
          # index, which on a fresh watcher-state includes main's .gitignore
          # (it ignores state/snapshot.json there deliberately). watcher-state
          # is a different branch with different rules -- we always want this
          # file tracked here, so force past an ignore rule that was never
          # written with this branch in mind.
          git add -f state/snapshot.json
          if git diff --cached --quiet -- state/snapshot.json 2>/dev/null; then
            echo "No snapshot change."
            exit 0
          fi
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:watcher-state
