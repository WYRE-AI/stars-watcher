name: Daily digest

on:
  schedule:
    # 14:00 UTC = 10:00 ET (EDT) / 09:00 ET (EST). Aim for "morning coffee" eyeballs.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run report
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN || secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python script/report.py

      - name: Commit updated snapshot
        run: |
          if git diff --quiet state/snapshot.json; then
            echo "No snapshot change."
            exit 0
          fi
          git config user.name "wyre-stars-watcher[bot]"
          git config user.email "stars-watcher@users.noreply.github.com"
          git add state/snapshot.json
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
