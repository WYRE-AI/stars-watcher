name: Daily digest

on:
  schedule:
    # 14:00 UTC = 10:00 ET (EDT) / 09:00 ET (EST). Aim for "morning coffee" eyeballs.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run report
        env:
          # GH_TOKEN handles general org/repo listing — the workflow's built-in
          # GITHUB_TOKEN has every permission we need for that.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_API_TOKEN is the fine-grained PAT used only for cross-repo
          # traffic data (Administration:Read). Optional — clone traffic
          # degrades to a "skipped" line when this is unset.
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python script/report.py

      - name: Commit updated snapshot
        run: |
          git config user.name "wyre-stars-watcher[bot]"
          git config user.email "stars-watcher@users.noreply.github.com"
          git add state/snapshot.json
          if git diff --cached --quiet -- state/snapshot.json; then
            echo "No snapshot change."
            exit 0
          fi
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
